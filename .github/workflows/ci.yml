# allpets-frontend CI — typecheck + lint + production build on pull requests
# (issue #52 / 15.3). Provides the stable "ci" status check the "Protect main"
# ruleset requires before merge. Uses only GitHub-owned, SHA-pinned actions
# (kept in lockstep with cd.yml and within the repo's restricted Actions
# allowlist). There is no test suite yet (scripts are typecheck/lint/build);
# a `pnpm test` step slots in between lint and build when one lands.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # corepack downloads the pnpm pinned by package.json `packageManager`;
  # suppress its interactive first-download prompt on CI runners.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm comes from corepack (bundled with Node, honors `packageManager`) —
      # no third-party pnpm action, so the restricted Actions allowlist stays
      # GitHub-owned + verified + tailscale/github-action only. Enabled BEFORE
      # setup-node so its `cache: pnpm` can resolve `pnpm store path`.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Dependency audit (14.7): fail on any known HIGH/CRITICAL advisory in the
      # production dependency tree (dev-only deps never ship in the image).
      # --audit-level=high both gates and filters: only advisories at/above
      # high are reported and fail the job — lower severities are not shown
      # here at all (run a plain `pnpm audit` locally to see them).
      # PR-introduced deps are additionally diffed by the dependency-review job
      # below; the remediation loop is Dependabot (15.7, .github/dependabot.yml).
      - name: Audit production dependencies (pnpm audit)
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Catches build-only failures the checks above can't: content-layer zod
      # validation (src/lib/content fail-fast parseOrThrow), MDX compilation, and
      # the env validators once Epic 9/11 start importing publicEnv. The artifact
      # is discarded — the deployable image is built by cd.yml. NEXT_PUBLIC_*
      # come from sourcing .env.example — the one documented home of these
      # public values (deploy/Dockerfile ARG defaults mirror the same file), so
      # there's no third hardcoded copy here to drift.
      - name: Production build
        run: |
          set -a; . ./.env.example; set +a
          pnpm build

      # Boot the EXACT artifact the Docker image ships and require it to serve.
      # A green `pnpm build` is not proof the standalone runtime works: next
      # 16.3.1 built clean but its standalone trace omitted @swc/helpers/esm,
      # crashing the pod at boot (first prod deploy, 2026-08-23). This step
      # catches that whole class before merge. --smoke shares the a11y scan's
      # boot contract (scripts/a11y-scan.mjs: static+public copied beside the
      # artifact, /api/health verified via a per-run nonce, EVERY route from
      # the prerender manifest preflighted — HTML pages for their expected
      # status, and the 12.2/12.3 metadata files (sitemap.xml, robots.txt,
      # icons) for 200 + non-empty) but runs no axe — kept as its own step so
      # a boot failure and an a11y failure stay separately diagnosable.
      - name: Standalone runtime smoke test
        run: pnpm a11y --smoke

      # Automated WCAG 2.1 A/AA audit (issue #44 / 12.6, req §8.1). The script
      # re-boots the same standalone artifact the smoke test just validated and
      # runs @axe-core/cli over every route in the prerender manifest (plus the
      # 404 template); ANY violation of the WCAG 2.0/2.1 A+AA rule set fails
      # the job (and therefore the required "ci" check). Axe catches ~30-50% of
      # WCAG issues — a regression gate, not a substitute for the manual audit
      # (12.7). No new action and no npm-downloaded driver (its postinstall is
      # skipped in pnpm-workspace.yaml): ubuntu runners preinstall Chrome plus
      # a matching chromedriver and export its directory as $CHROMEWEBDRIVER.
      # Pinned explicitly via $CHROMEDRIVER so a bad/missing runner driver
      # hard-fails with a clear message instead of silently downgrading to
      # whatever is on PATH; the script's resolution ladder remains for local
      # runs.
      - name: Accessibility audit (axe-core, WCAG 2.1 AA)
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" pnpm a11y

  # Dependency review (14.7): fails the PR when an added/updated dependency
  # (npm or GitHub Actions) carries a known advisory of high or critical
  # severity. Complements the pnpm-audit step above: audit checks the whole
  # installed tree against today's advisories, dependency-review gates exactly
  # what this PR changes. Runs on the pull_request event only — the action
  # diffs the base↔head dependency graphs, so it has nothing to compare on
  # workflow_dispatch (the ci aggregator below tolerates that skip).
  # actions/dependency-review-action is GitHub-owned, so the repo's restricted
  # Actions allowlist is unchanged.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Single, stable required-status-check context for branch protection. Stays
  # "ci" even as the jobs above evolve (tests, Playwright, audits, …), so the
  # ruleset never needs editing when the pipeline changes. Mirrors the
  # allpets-backend ci.yml pattern.
  ci:
    if: always()
    needs: [build-and-test, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to pass
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "::error::build-and-test result was '${{ needs.build-and-test.result }}'"
            exit 1
          fi
          # dependency-review only runs on pull_request; on workflow_dispatch it
          # is skipped by design. Anything else (failure/cancelled) fails ci.
          case "${{ needs.dependency-review.result }}" in
            success|skipped) ;;
            *) echo "::error::dependency-review result was '${{ needs.dependency-review.result }}'"; exit 1 ;;
          esac
          echo "All required CI jobs passed."
