# Build scripts stay ignored (status quo before this file existed) — sharp ships
# prebuilt @img/* binaries, and unrs-resolver's prebuilt binary is dev-only.
allowBuilds:
  sharp: false
  unrs-resolver: false
# Dependabot security floors for vulnerable transitives whose parents pin lower
# (see the chore/dependabot-security-bumps PR). Drop each once the parent catches up.
overrides:
  'js-yaml@3': ^3.15.1
  'js-yaml@4': ^4.3.1
  'brace-expansion@1': ^1.1.16
  'postcss@<8.5.23': ^8.5.23
  'sharp@<0.35.0': ^0.35.0
