# Build scripts stay ignored (status quo before this file existed) — sharp ships
# prebuilt @img/* binaries, and unrs-resolver's prebuilt binary is dev-only.
allowBuilds:
  sharp: false
  unrs-resolver: false
# Dependabot security floors for vulnerable transitives whose parents pin lower
# (see the chore/dependabot-security-bumps PR). Drop each once the parent catches up.
overrides:
  'js-yaml@3': ^3.15.1
  'js-yaml@4': ^4.3.1
  'brace-expansion@1': ^1.1.16
  'postcss@<8.5.23': ^8.5.23
  # sharp deliberately NOT overridden: next must own its sharp range or output
  # tracing omits the @img libvips runtime and /_next/image 500s in standalone.
  # next >= 16.3.0 ranges sharp ^0.35.3 (patched) natively.
